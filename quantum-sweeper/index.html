<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>量子自殺マインスイーパー</title>
<style>
:root{--bg:#0b0f1a;--panel:#121a2b;--line:#26324d;--ink:#e7ecf6;--mute:#8e9ab5;--gold:#f2c66b;--safe:#1a2338;--cell:#2b3858;--cellhi:#364670;--risk:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:20px 16px 40px}
main{max-width:680px;margin:0 auto}
a.back{display:inline-block;margin:0 0 6px;font-size:13px;color:var(--mute);text-decoration:none}
a.back:hover,a.back:focus-visible{color:var(--gold)}
h1{margin:0 0 12px;font:700 clamp(22px,5vw,30px)/1.25 "Hiragino Mincho ProN","Yu Mincho",serif}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
button{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover,button:focus-visible{border-color:var(--gold);outline:none}
button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:6px;margin:0 0 10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.stat .k{display:block;font-size:11px;color:var(--mute)}
.stat .v{font:600 17px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
#board{--w:9;display:grid;grid-template-columns:repeat(var(--w),1fr);gap:2px;width:min(100%,calc(var(--w)*38px));margin:0 auto;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.c{position:relative;aspect-ratio:1;border:0;border-radius:3px;padding:0;background:var(--cell);color:var(--ink);font:700 calc(min(100vw - 32px,var(--w)*38px)/var(--w)*.42)/1 ui-monospace,Menlo,monospace;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-touch-callout:none}
.c:hover{background:var(--cellhi)}
.c.o{background:var(--safe);cursor:default}
.c.o.fz{font-size:calc(min(100vw - 32px,var(--w)*38px)/var(--w)*.32)}
.c .d{position:absolute;right:2px;top:1px;font-size:calc(min(100vw - 32px,var(--w)*38px)/var(--w)*.26);color:var(--mute);font-weight:400}
.c .pr{position:absolute;inset:auto 0 1px;font-size:calc(min(100vw - 32px,var(--w)*38px)/var(--w)*.24);font-weight:400;color:#fff;opacity:.85}
.c.f::after{content:"⚑";color:var(--gold)}
.c.m{background:#5a2330}
.c.m::after{content:"●";color:var(--risk)}
.c.k{background:#4a3416}
.c.k::after{content:"◆";color:var(--gold)}
.c.last{outline:2px solid var(--gold);outline-offset:-2px}
.n1{color:#7fb2ff}.n2{color:#7fe0a0}.n3{color:#ff8b8b}.n4{color:#c39bff}.n5{color:#ffb86b}.n6{color:#6fe3e3}.n7,.n8{color:#ddd}.nz{color:#b9c4dc}
#msg{min-height:1.7em;text-align:center;font-family:ui-monospace,Menlo,monospace;margin:10px 0 0;font-size:14px}
#msg b{color:var(--gold)}
#result{display:none;margin:12px 0;padding:12px 14px;background:var(--panel);border:1px solid var(--gold);border-radius:10px}
#result h2{margin:0 0 6px;font-size:18px}
#result dl{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:8px 0 0;font-size:14px}
#result dt{color:var(--mute)}
#result dd{margin:0;font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
#result .rank{font:800 32px/1 ui-monospace,monospace;color:var(--gold);margin-right:10px}
details{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
summary{cursor:pointer;font-weight:700}
details p,details li{font-size:14px;color:#cdd5e6}
.mono{font-family:ui-monospace,Menlo,monospace}
</style></head><body><main>
<a class="back" href="../">← 作品一覧</a>
<h1>量子自殺マインスイーパー</h1>
<div class="bar">
  <span role="group" aria-label="盤の大きさ">
    <button data-size="9,9,10" aria-pressed="true">9×9</button>
    <button data-size="16,16,40" aria-pressed="false">16×16</button>
  </span>
  <span role="group" aria-label="手がかりの曖昧さ">
    <button data-fog="0" aria-pressed="false">精密</button>
    <button data-fog="1" aria-pressed="true">曖昧</button>
    <button data-fog="2" aria-pressed="false">濃霧</button>
  </span>
</div>
<div class="bar">
  <span role="group" aria-label="評価のモード">
    <button data-mode="safe" aria-pressed="true">安全第一</button>
    <button data-mode="cost" aria-pressed="false">最小コスト</button>
  </span>
  <button id="autochord" aria-pressed="false" aria-label="旗で決まるマスを自動で開ける">⚑ 自動</button>
</div>
<div class="bar">
  <span role="group" aria-label="タップの操作">
    <button data-tap="open" aria-pressed="true">開ける</button>
    <button data-tap="mine" aria-pressed="false" aria-label="地雷に賭ける">◆</button>
    <button data-tap="flag" aria-pressed="false" aria-label="旗">⚑</button>
  </span>
  <button id="showp" aria-pressed="false">p</button>
  <button id="reset" aria-label="新しい盤">↻</button>
</div>
<div class="stats">
  <div class="stat"><span class="k">Ω</span><span class="v" id="omega"></span></div>
  <div class="stat"><span class="k">L</span><span class="v" id="Lv"></span></div>
  <div class="stat"><span class="k">I</span><span class="v" id="Iv"></span></div>
  <div class="stat"><span class="k">2<sup>−L</sup></span><span class="v" id="surv"></span></div>
</div>
<div id="board" role="grid" aria-label="盤"></div>
<p id="msg" aria-live="polite"></p>
<div id="result" aria-live="polite"></div>
<details>
<summary>ルール</summary>
<ul>
<li>配置は決まっていない。Ω = 手がかりと矛盾しない配置の数、p = 地雷がある配置の割合。Ω = 1 でクリア</li>
<li>開ける: <span class="mono">−log₂(1−p)</span>。◆: <span class="mono">−log₂p</span>（手がかりは出ない）</li>
<li><span class="mono">L + I + log₂Ω = log₂Ω₀</span></li>
<li>安全第一: 推理ミス + 賭けの損でランク。最小コスト: L / log₂Ω₀ でランク</li>
</ul>
</details>
</main>
<script type="module">
import { Game, MIXES, rank, rankCost } from './game.js';

const $ = id => document.getElementById(id);
const board = $('board');
const MARK = { exact: '', range: '≈', pair: '|', parity: '◐' };
let size = [9, 9, 10], fog = 1, mode = 'safe', autoChord = false, tap = 'open', showP = false;
let g, cells, last = -1;

function fmtOmega(o) {
  if (o < 1e6) return Math.round(o).toLocaleString();
  const e = Math.floor(Math.log10(o));
  return `${(o / 10 ** e).toFixed(2)}e${e}`;
}
const pct = p => p === 0 ? '0' : p >= 0.995 && p < 1 ? '>99' : p < 0.005 ? '<1' : (p * 100).toFixed(0);

function newGame() {
  const [W, H, M] = size;
  g = new Game(W, H, M, MIXES[fog]);
  g.autoChord = mode === 'safe' && autoChord;
  last = -1;
  board.style.setProperty('--w', W);
  board.innerHTML = '';
  cells = [];
  for (let i = 0; i < W * H; i++) {
    const b = document.createElement('button');
    b.className = 'c';
    b.dataset.i = i;
    board.appendChild(b);
    cells.push(b);
  }
  $('msg').innerHTML = '';
  $('result').style.display = 'none';
  render();
}

function render() {
  const { W, H } = g;
  const over = g.state !== 'play';
  for (let i = 0; i < W * H; i++) {
    const b = cells[i];
    let cls = 'c', html = '';
    if (g.opened[i]) {
      cls += ' o';
      const t = g.label[i];
      html = t;
      if (/^\d$/.test(t)) cls += ' n' + t;
      else if (t) cls += ' nz fz';
    } else {
      const p = g.prob(i);
      if (g.mines.has(i)) cls += ' k';
      else if (over && p > 1 - 1e-9) cls += ' m';
      else if (g.flags.has(i)) cls += ' f';
      // 検出器の印は、そのマスを開ける見込みがある間だけ出す。消すのはプレイヤーが自分で決めたマス（◆・旗）と、
      // 確率を表示している時の p = 1 のマス。確率を隠している時に p から消すと、答えが漏れる
      const hideMark = g.mines.has(i) || g.flags.has(i) || ((showP || over) && p > 1 - 1e-9);
      if (MARK[g.det[i]] && !hideMark) html += `<span class="d">${MARK[g.det[i]]}</span>`;
      if (showP && !over && !g.mines.has(i)) {
        html += `<span class="pr">${pct(p)}</span>`;
        b.style.background = `color-mix(in srgb, var(--risk) ${Math.round(p * 70)}%, var(--cell))`;
      } else b.style.background = '';
    }
    if (g.opened[i]) b.style.background = '';
    if (i === last) cls += ' last';
    b.className = cls;
    b.innerHTML = html;
    b.setAttribute('aria-label', g.opened[i] ? `開いた ${g.label[i] || '0'}` : g.mines.has(i) ? '地雷に賭けたマス' : g.flags.has(i) ? '旗' : '未開放');
  }
  $('omega').textContent = fmtOmega(g.an.omega);
  $('Lv').textContent = g.L.toFixed(2);
  $('Iv').textContent = g.I.toFixed(2);
  const s = 2 ** -g.L;
  $('surv').textContent = s >= 0.01 ? (s * 100).toFixed(1) + '%' : s.toExponential(1).replace('e', '×10^') + '%';
}

// 開いた手がかりのマスを押すと、その手がかりと旗で安全と決まる周りのマスをまとめて開ける
function chord(i) {
  const targets = g.chordTargets(i);
  if (!targets.length) return;
  let cost = 0, risky = 0;
  const opened = [];
  for (const t of targets) {
    if (g.state !== 'play' || !g.free(t)) continue;
    const r = g.open(t);
    // 直前のマスで世界が1つに決まっていると、開ける前にクリアになって null が返る
    if (!r) break;
    last = t;
    if (g.state === 'dead') break;
    cost += r.cost;
    if (r.p > 0) risky++;
    opened.push(t);
  }
  g.auto = null;
  if (g.state !== 'dead') g.settle(opened);
  if (g.state === 'dead') showResult(false);
  else {
    $('msg').innerHTML = risky ? `<b>+${cost.toFixed(2)} bit</b>` : '+0';
    $('msg').innerHTML += autoNote();
    if (g.state === 'clear') showResult(true);
  }
  render();
}

// 旗で決まるマスを自動で開けた分
function autoNote() {
  const a = g.auto;
  if (!a || !a.count || g.state === 'dead') return '';
  return ` · ⚑ ${a.count}` + (a.cost > 0 ? ` <b>+${a.cost.toFixed(2)}</b>` : '');
}

// 旗を置いた後や自動開放を有効にした時に、旗で決まるマスを開ける
function settleNow() {
  if (g.state !== 'play' || !g.autoChord) return;
  g.settle();
  if (g.state === 'dead') showResult(false);
  else {
    if (g.auto.count) $('msg').innerHTML = autoNote().replace(/^ · /, '');
    if (g.state === 'clear') showResult(true);
  }
}

// 賭けの直後に出す数字: p とコスト。一番安い賭けより高かった時はその値も並べる
function betLine(r, m) {
  if (r.cost === 0) return '+0';
  let t = `p ${(r.p * 100).toFixed(1)}% · <b>+${r.cost.toFixed(2)} bit</b>`;
  if (m.safeExists && mode === 'safe') t += ' · ✕';
  else if (!m.safeExists && m.cost > m.best + 1e-9) t += ` · 最安 ${m.best.toFixed(2)}`;
  return t;
}

function act(i) {
  if (g.state !== 'play') return;
  if (g.opened[i]) { chord(i); return; }
  if (g.mines.has(i)) return;
  if (tap === 'flag') { toggleFlag(i); return; }
  if (tap === 'mine') { betMine(i); return; }
  const r = g.step(i);
  last = i;
  const m = g.moves[g.moves.length - 1];
  if (g.state === 'dead') showResult(false);
  else {
    $('msg').innerHTML = betLine(r, m) + autoNote();
    if (g.state === 'clear') showResult(true);
  }
  render();
}

function betMine(i) {
  const r = g.claim(i);
  if (!r) return;
  last = i;
  const m = g.moves[g.moves.length - 1];
  if (g.state === 'dead') showResult(false);
  else {
    $('msg').innerHTML = betLine(r, m) + autoNote();
    if (g.state === 'clear') showResult(true);
  }
  render();
}

function showResult(ok) {
  const el = $('result');
  $('msg').innerHTML = '';
  if (!ok) {
    el.innerHTML = '<h2>観測者消滅</h2>';
  } else {
    const ratio = g.L / g.H0, b = g.breakdown, loss = b.error + b.gap;
    const f = x => x.toFixed(2);
    const rows = mode === 'safe'
      ? [['推理ミス', `${f(b.error)}（${b.errors}）`], ['賭けの損', f(b.gap)], ['不可避', f(b.forced)]]
      : [];
    rows.push(['L', `${f(g.L)} / ${g.H0.toFixed(1)}（${(ratio * 100).toFixed(1)}%）`], ['◆', f(b.mineCost)]);
    el.innerHTML = `<h2><span class="rank">${mode === 'safe' ? rank(loss) : rankCost(ratio)}</span>Ω = 1</h2>
      <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
  }
  el.style.display = 'block';
}

function toggleFlag(i) {
  if (!g.free(i) || g.state !== 'play') return;
  g.flags.has(i) ? g.flags.delete(i) : g.flags.add(i);
  settleNow();
  render();
}

// タップで開ける。長押しと右クリックで旗
let pressTimer = 0, longPressed = false;
board.addEventListener('pointerdown', e => {
  const b = e.target.closest('.c'); if (!b) return;
  longPressed = false;
  if (e.pointerType !== 'mouse') pressTimer = setTimeout(() => { longPressed = true; toggleFlag(+b.dataset.i); }, 420);
});
const cancel = () => clearTimeout(pressTimer);
board.addEventListener('pointerup', cancel);
board.addEventListener('pointerleave', cancel);
board.addEventListener('pointercancel', cancel);
board.addEventListener('click', e => {
  const b = e.target.closest('.c'); if (!b) return;
  if (longPressed) { longPressed = false; return; }
  act(+b.dataset.i);
});
board.addEventListener('contextmenu', e => {
  const b = e.target.closest('.c'); if (!b) return;
  e.preventDefault();
  toggleFlag(+b.dataset.i);
});

document.querySelectorAll('[data-size]').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('[data-size]').forEach(x => x.setAttribute('aria-pressed', x === btn));
  size = btn.dataset.size.split(',').map(Number);
  newGame();
}));
document.querySelectorAll('[data-fog]').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('[data-fog]').forEach(x => x.setAttribute('aria-pressed', x === btn));
  fog = +btn.dataset.fog;
  newGame();
}));
document.querySelectorAll('[data-tap]').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('[data-tap]').forEach(x => x.setAttribute('aria-pressed', x === btn));
  tap = btn.dataset.tap;
}));
$('showp').addEventListener('click', e => { showP = !showP; e.currentTarget.setAttribute('aria-pressed', showP); render(); });
$('reset').addEventListener('click', newGame);
document.querySelectorAll('[data-mode]').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === btn));
  mode = btn.dataset.mode;
  $('autochord').hidden = mode !== 'safe';
  newGame();
}));
$('autochord').addEventListener('click', e => {
  autoChord = !autoChord;
  e.currentTarget.setAttribute('aria-pressed', autoChord);
  g.autoChord = mode === 'safe' && autoChord;
  settleNow();
  render();
});

newGame();
</script>
</body></html>
