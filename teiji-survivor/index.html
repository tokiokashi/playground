<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#151b26">
<title>定時サバイバー</title>
<style>
:root{
  --bg:#151b26;--floor:#1b2331;--line:#263043;--panel:#1f2838;--ink:#eef2f8;--mute:#9aa6bb;
  --accent:#f3c75c;--ok:#5ad3a0;--hp:#ef5b6b;--xp:#6aa8ff;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font:400 15px/1.6 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
  background:rgba(10,14,22,.78);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);touch-action:manipulation}
.overlay.show{display:flex}
.box{width:100%;max-width:420px;text-align:center}
h1{margin:0 0 4px;font:800 clamp(30px,9vw,44px)/1.15 "Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.04em}
h2{margin:0 0 14px;font-size:20px}
.sub{color:var(--mute);margin:0 0 20px;font-size:14px}
.rules{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:0 0 20px;font-size:14px}
.rules p{margin:4px 0}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.primary{width:100%;padding:16px;border-radius:12px;background:var(--accent);color:#1a1405;font-weight:800;font-size:18px}
.primary:active{transform:scale(.98)}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:14px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line)}
.choice:active{border-color:var(--accent)}
.choice .icon{flex:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#10151f}
.choice .name{font-weight:700}
.choice .lv{color:var(--accent);font-size:12px;margin-left:6px}
.choice .desc{display:block;color:var(--mute);font-size:13px;line-height:1.45}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.stat b{display:block;font-size:22px}
.stat span{color:var(--mute);font-size:12px}
.verdict{font-size:15px;margin:0 0 16px}
kbd{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--mute)}
.pc{color:var(--mute);font-size:12px;margin:10px 0 0}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="overlay show" id="title">
  <div class="box">
    <p class="sub" style="margin:0 0 6px">16:00 ― あと1時間で定時</p>
    <h1>定時サバイバー</h1>
    <p class="sub">通知・会議・仕様変更から逃げ切って、17:00に退社せよ。</p>
    <div class="rules">
      <p>👆 画面のどこかを押さえて、そのまま指をずらすと移動</p>
      <p>⚔️ 攻撃は自動。落ちた「工数」を拾うとレベルアップ</p>
      <p>⏱ 1プレー60秒。17:00まで生き残れば勝ち</p>
    </div>
    <button class="primary" id="start">出社する</button>
    <p class="pc">PC: <kbd>WASD</kbd> / <kbd>矢印</kbd> で移動、<kbd>1</kbd>〜<kbd>3</kbd> で選択</p>
  </div>
</div>

<div class="overlay" id="levelup">
  <div class="box">
    <h2>スキルが身についた</h2>
    <div class="choices" id="choices"></div>
  </div>
</div>

<div class="overlay" id="result">
  <div class="box">
    <p class="sub" id="rTime" style="margin:0 0 4px"></p>
    <h1 id="rTitle"></h1>
    <p class="verdict" id="rVerdict"></p>
    <div class="stats" id="rStats"></div>
    <button class="primary" id="retry">もう一度出社する</button>
  </div>
</div>

<script>
'use strict';
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const GAME_SEC = 60;            // 16:00〜17:00 を60秒で
const START_MIN = 16 * 60;
const FONT = '"Hiragino Sans","Yu Gothic",system-ui,sans-serif';

// ---------- 画面 ----------
let W = 0, H = 0, DPR = 1, ZOOM = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  // スマホ縦持ちで、短辺に約420ワールド単位が入るように
  ZOOM = Math.max(0.7, Math.min(1.4, Math.min(W, H) / 420));
}
addEventListener('resize', resize);
resize();

// ---------- 定義 ----------
const ENEMY = {
  notice:  { label: '通知',     r: 11, hp: 2,   speed: 80,  dmg: 6,  xp: 1,  color: '#f3c75c', from: 0 },
  meeting: { label: '会議',     r: 15, hp: 6,   speed: 48,  dmg: 9,  xp: 2,  color: '#6aa8ff', from: 8 },
  cut:     { label: '差し込み', r: 12, hp: 4,   speed: 185, dmg: 8,  xp: 2,  color: '#ff9b52', from: 15 },
  spec:    { label: '仕様変更', r: 22, hp: 24,  speed: 36,  dmg: 15, xp: 6,  color: '#b58cff', from: 30 },
  boss:    { label: 'ちょっといい？', r: 38, hp: 170, speed: 52, dmg: 25, xp: 30, color: '#ef5b6b', from: 999 },
};

const SKILLS = {
  reply:  { kind: 'weapon', name: '定型返信', icon: '了', color: '#5ad3a0',
            desc: lv => ['一番近い相手に「了解です」を飛ばす', '連射が速くなる', '2通同時に送る', '貫通する', '3通同時に送る'][lv - 1] },
  aura:   { kind: 'weapon', name: '既読スルー', icon: '既', color: '#8fd3ff',
            desc: lv => ['周りの相手にじわじわダメージ', '範囲が広がる', 'ダメージが上がる', '範囲が広がる', '範囲とダメージが上がる'][lv - 1] },
  orbit:  { kind: 'weapon', name: '議事録', icon: '議', color: '#e8e8e8',
            desc: lv => ['周りを議事録が回って弾く', '議事録が2枚になる', '3枚になる', '4枚になる', '5枚になって速く回る'][lv - 1] },
  nova:   { kind: 'weapon', name: '全員に返信', icon: 'Re', color: '#f3c75c',
            desc: lv => ['定期的に全方位へ返信をばらまく', '通数が増える', '間隔が短くなる', '通数が増える', '間隔が短くなりダメージ上昇'][lv - 1] },
  coffee: { kind: 'passive', name: 'コーヒー', icon: '珈', color: '#c79a6a', desc: () => '移動速度 +12%' },
  nc:     { kind: 'passive', name: 'ノイキャン', icon: '静', color: '#9aa6bb', desc: () => '受けるダメージ -12%' },
  memo:   { kind: 'passive', name: '付箋', icon: '付', color: '#ffe36a', desc: () => '工数を拾う範囲 +40%' },
  early:  { kind: 'passive', name: '朝活', icon: '朝', color: '#ffb36a', desc: () => '攻撃間隔 -10%' },
};
const MAX_LV = 5;

// ---------- 状態 ----------
let S = null;
function newGame() {
  S = {
    t: 0, running: true, paused: false, over: false,
    p: { x: 0, y: 0, hp: 100, maxHp: 100, face: 0, hurt: 0 },
    lv: 1, xp: 0, xpNext: 4, kills: 0, damage: 0,
    skills: { reply: 1 },
    enemies: [], shots: [], gems: [], texts: [], snacks: [],
    cds: { reply: 0, nova: 1.5, aura: 0 },
    spawnAcc: 0, bossSpawned: false, bossDefeated: false, shake: 0,
    pendingLevels: 0,
  };
}
const lvOf = k => S.skills[k] || 0;
const speedMul = () => 1 + 0.12 * lvOf('coffee');
const dmgTakenMul = () => 1 - 0.12 * lvOf('nc');
const pickupR = () => 48 * (1 + 0.4 * lvOf('memo'));
const cdMul = () => 1 - 0.1 * lvOf('early');

// ---------- 入力 ----------
const keys = new Set();
addEventListener('keydown', e => {
  keys.add(e.key.toLowerCase());
  if ($('levelup').classList.contains('show') && /^[1-3]$/.test(e.key)) {
    const b = $('choices').children[+e.key - 1];
    if (b) b.click();
  }
  if ((e.key === 'Enter' || e.key === ' ') && !S?.running) {
    if ($('title').classList.contains('show')) $('start').click();
    else if ($('result').classList.contains('show')) $('retry').click();
  }
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => { keys.clear(); stick.id = null; });

// 画面のどこを押さえてもそこがスティックの中心になる
const stick = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
const STICK_R = 56;
cv.addEventListener('pointerdown', e => {
  if (stick.id !== null) return;
  stick.id = e.pointerId; stick.ox = stick.x = e.clientX; stick.oy = stick.y = e.clientY;
  cv.setPointerCapture(e.pointerId);
  e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== stick.id) return;
  stick.x = e.clientX; stick.y = e.clientY;
});
const endStick = e => { if (e.pointerId === stick.id) stick.id = null; };
cv.addEventListener('pointerup', endStick);
cv.addEventListener('pointercancel', endStick);
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());

function inputVec() {
  let x = 0, y = 0;
  if (keys.has('a') || keys.has('arrowleft')) x -= 1;
  if (keys.has('d') || keys.has('arrowright')) x += 1;
  if (keys.has('w') || keys.has('arrowup')) y -= 1;
  if (keys.has('s') || keys.has('arrowdown')) y += 1;
  if (stick.id !== null) {
    const dx = stick.x - stick.ox, dy = stick.y - stick.oy;
    const d = Math.hypot(dx, dy);
    if (d > 6) { const m = Math.min(1, d / STICK_R); x = dx / d * m; y = dy / d * m; }
  }
  const m = Math.hypot(x, y);
  if (m > 1) { x /= m; y /= m; }
  return { x, y };
}

// ---------- 生成 ----------
function spawnEnemy(type) {
  const def = ENEMY[type];
  const viewR = Math.hypot(W, H) / 2 / ZOOM + 40;
  // 逃げ続けるだけでは勝てないように、半分は進行方向の前から湧かせる
  const mv = inputVec();
  const a = (mv.x || mv.y) && Math.random() < 0.5
    ? Math.atan2(mv.y, mv.x) + (Math.random() - 0.5) * 2.1
    : Math.random() * Math.PI * 2;
  const scale = 1 + S.t / 60;                 // 時間が経つほど硬くなる
  S.enemies.push({
    type, def, x: S.p.x + Math.cos(a) * viewR, y: S.p.y + Math.sin(a) * viewR,
    hp: def.hp * (type === 'boss' ? 1 : scale), maxHp: def.hp * (type === 'boss' ? 1 : scale),
    flash: 0, hitCd: {}, kx: 0, ky: 0,
  });
}
function pickType() {
  const pool = Object.entries(ENEMY).filter(([k, d]) => k !== 'boss' && S.t >= d.from);
  const weight = { notice: 6, meeting: 3, cut: 2.5, spec: 1 };
  let sum = pool.reduce((s, [k]) => s + weight[k], 0), r = Math.random() * sum;
  for (const [k] of pool) { r -= weight[k]; if (r <= 0) return k; }
  return 'notice';
}

function addText(x, y, str, color, size = 13) {
  S.texts.push({ x, y, str, color, size, life: 0.7 });
}

// ---------- 攻撃 ----------
function nearestEnemies(n) {
  return S.enemies
    .map(e => ({ e, d: (e.x - S.p.x) ** 2 + (e.y - S.p.y) ** 2 }))
    .sort((a, b) => a.d - b.d).slice(0, n).map(o => o.e);
}
function fire(x, y, vx, vy, opts) {
  S.shots.push({ x, y, vx, vy, life: opts.life, dmg: opts.dmg, pierce: opts.pierce, r: opts.r,
                 label: opts.label, color: opts.color, hit: new Set() });
}

function updateWeapons(dt) {
  const p = S.p, cm = cdMul();
  // 定型返信
  const rl = lvOf('reply');
  if (rl) {
    S.cds.reply -= dt;
    if (S.cds.reply <= 0 && S.enemies.length) {
      S.cds.reply = (rl >= 2 ? 0.5 : 0.7) * cm;
      const n = rl >= 5 ? 3 : rl >= 3 ? 2 : 1;
      const targets = nearestEnemies(n);
      targets.forEach(t => {
        const a = Math.atan2(t.y - p.y, t.x - p.x);
        fire(p.x, p.y, Math.cos(a) * 430, Math.sin(a) * 430,
          { life: 1.1, dmg: 4 + rl * 1.5, pierce: rl >= 4 ? 3 : 1, r: 10, label: '了解です', color: '#5ad3a0' });
      });
    }
  }
  // 全員に返信
  const nl = lvOf('nova');
  if (nl) {
    S.cds.nova -= dt;
    if (S.cds.nova <= 0) {
      S.cds.nova = (nl >= 5 ? 1.7 : nl >= 3 ? 2.2 : 2.8) * cm;
      const n = 8 + (nl >= 2 ? 3 : 0) + (nl >= 4 ? 3 : 0);
      for (let i = 0; i < n; i++) {
        const a = i / n * Math.PI * 2 + S.t;
        fire(p.x, p.y, Math.cos(a) * 300, Math.sin(a) * 300,
          { life: 0.9, dmg: 4 + nl * (nl >= 5 ? 2 : 1.2), pierce: 2, r: 9, label: 'Re:', color: '#f3c75c' });
      }
    }
  }
  // 既読スルー
  const al = lvOf('aura');
  if (al) {
    S.cds.aura -= dt;
    if (S.cds.aura <= 0) {
      S.cds.aura = 0.3;
      const R = auraR(), dmg = (2 + al * 1.2 + (al >= 3 ? 1.5 : 0)) * 0.3 * 3;
      for (const e of S.enemies) {
        if ((e.x - p.x) ** 2 + (e.y - p.y) ** 2 < (R + e.def.r) ** 2) hurtEnemy(e, dmg, false);
      }
    }
  }
  // 議事録
  const ol = lvOf('orbit');
  if (ol) {
    const n = ol, R = 78, spd = ol >= 5 ? 4.2 : 3;
    for (let i = 0; i < n; i++) {
      const a = S.t * spd + i / n * Math.PI * 2;
      const ox = p.x + Math.cos(a) * R, oy = p.y + Math.sin(a) * R;
      for (const e of S.enemies) {
        if ((e.x - ox) ** 2 + (e.y - oy) ** 2 < (e.def.r + 13) ** 2 && !(e.hitCd.orbit > 0)) {
          e.hitCd.orbit = 0.45;
          hurtEnemy(e, 5 + ol * 1.5, true);
          const d = Math.hypot(e.x - p.x, e.y - p.y) || 1;
          if (e.type !== 'boss') { e.kx += (e.x - p.x) / d * 160; e.ky += (e.y - p.y) / d * 160; }
        }
      }
    }
  }
}
const auraR = () => 52 + lvOf('aura') * 12 + (lvOf('aura') >= 5 ? 10 : 0);

function hurtEnemy(e, dmg, show = true) {
  e.hp -= dmg; e.flash = 0.08; S.damage += dmg;
  if (show) addText(e.x, e.y - e.def.r, Math.round(dmg), '#fff', 12);
}

// ---------- 更新 ----------
function update(dt) {
  S.t += dt;
  const p = S.p;

  // 移動
  const v = inputVec();
  const sp = 165 * speedMul();
  p.x += v.x * sp * dt; p.y += v.y * sp * dt;
  if (v.x || v.y) p.face = Math.atan2(v.y, v.x);
  p.hurt = Math.max(0, p.hurt - dt);

  // 湧き
  const rate = 1.2 + S.t * 0.3;                // 60秒時点で毎秒約19体
  S.spawnAcc += rate * dt;
  while (S.spawnAcc >= 1) {
    S.spawnAcc -= 1;
    if (S.enemies.length < 320) spawnEnemy(pickType());
  }
  if (!S.bossSpawned && S.t >= 40) {
    S.bossSpawned = true; spawnEnemy('boss');
    addText(p.x, p.y - 60, '16:40 「ちょっといい？」', '#ef5b6b', 18);
  }

  updateWeapons(dt);

  // 敵
  for (const e of S.enemies) {
    const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
    e.x += (dx / d * e.def.speed + e.kx) * dt;
    e.y += (dy / d * e.def.speed + e.ky) * dt;
    e.kx *= 0.86; e.ky *= 0.86;
    e.flash = Math.max(0, e.flash - dt);
    for (const k in e.hitCd) e.hitCd[k] -= dt;
    if (d < e.def.r + 13) {
      const dmg = e.def.dmg * dmgTakenMul() * dt;
      p.hp -= dmg;
      if (p.hurt <= 0) { p.hurt = 0.25; S.shake = reduceMotion ? 0 : 5; }
    }
  }
  // 軽い押し合い（隣接だけをざっくり）
  const grid = new Map(), CELL = 48;
  for (const e of S.enemies) {
    const key = (Math.floor(e.x / CELL)) + ',' + (Math.floor(e.y / CELL));
    (grid.get(key) || grid.set(key, []).get(key)).push(e);
  }
  for (const list of grid.values()) {
    for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
      const a = list[i], b = list[j];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01, min = a.def.r + b.def.r;
      if (d < min) {
        const push = (min - d) / 2 / d;
        const wa = a.type === 'boss' ? 0 : 1, wb = b.type === 'boss' ? 0 : 1;
        a.x -= dx * push * wa; a.y -= dy * push * wa; b.x += dx * push * wb; b.y += dy * push * wb;
      }
    }
  }

  // 弾
  for (const s of S.shots) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    for (const e of S.enemies) {
      if (s.pierce <= 0 || s.hit.has(e)) continue;
      if ((e.x - s.x) ** 2 + (e.y - s.y) ** 2 < (e.def.r + s.r) ** 2) {
        s.hit.add(e); s.pierce--; hurtEnemy(e, s.dmg);
        if (e.type !== 'boss') { const m = Math.hypot(s.vx, s.vy); e.kx += s.vx / m * 90; e.ky += s.vy / m * 90; }
      }
    }
  }
  S.shots = S.shots.filter(s => s.life > 0 && s.pierce > 0);

  // 撃破
  const alive = [];
  for (const e of S.enemies) {
    if (e.hp > 0) {
      // 遠くに置き去りになった雑魚は手前に回り込ませる
      if (e.type !== 'boss' && Math.hypot(e.x - p.x, e.y - p.y) > Math.hypot(W, H) / ZOOM) {
        const a = Math.random() * Math.PI * 2, R = Math.hypot(W, H) / 2 / ZOOM + 40;
        e.x = p.x + Math.cos(a) * R; e.y = p.y + Math.sin(a) * R;
      }
      alive.push(e); continue;
    }
    S.kills++;
    S.gems.push({ x: e.x, y: e.y, v: e.def.xp, pull: false });
    if (e.type === 'boss') {
      S.bossDefeated = true;
      addText(e.x, e.y - 50, '「…やっぱ明日でいいや」', '#ef5b6b', 17);
      S.snacks.push({ x: e.x + 30, y: e.y });
    } else if (Math.random() < 0.012) {
      S.snacks.push({ x: e.x, y: e.y });
    }
  }
  S.enemies = alive;

  // 工数（経験値）
  const pr = pickupR();
  for (const g of S.gems) {
    const dx = p.x - g.x, dy = p.y - g.y, d = Math.hypot(dx, dy) || 1;
    if (d < pr) g.pull = true;
    if (g.pull) { const sp2 = 380 + (pr - Math.min(d, pr)) * 4; g.x += dx / d * sp2 * dt; g.y += dy / d * sp2 * dt; }
    if (d < 16) { g.got = true; gainXp(g.v); }
  }
  S.gems = S.gems.filter(g => !g.got);
  // おやつ（回復）
  for (const s of S.snacks) {
    if (Math.hypot(p.x - s.x, p.y - s.y) < 24) {
      s.got = true; p.hp = Math.min(p.maxHp, p.hp + 30);
      addText(p.x, p.y - 28, 'おやつ +30', '#5ad3a0', 15);
    }
  }
  S.snacks = S.snacks.filter(s => !s.got);

  for (const t of S.texts) { t.life -= dt; t.y -= 30 * dt; }
  S.texts = S.texts.filter(t => t.life > 0);
  S.shake = Math.max(0, S.shake - dt * 30);

  if (p.hp <= 0) { p.hp = 0; endGame(false); return; }
  if (S.t >= GAME_SEC) { endGame(true); return; }
  if (S.pendingLevels > 0 && !S.paused) openLevelUp();
}

function gainXp(v) {
  S.xp += v;
  while (S.xp >= S.xpNext) {
    S.xp -= S.xpNext; S.lv++; S.xpNext = Math.round(3 + S.lv * 2.6);
    S.pendingLevels++;
  }
}

// ---------- レベルアップ ----------
function openLevelUp() {
  const can = Object.keys(SKILLS).filter(k => lvOf(k) < MAX_LV);
  const pick = [];
  while (pick.length < 3 && can.length) pick.push(can.splice(Math.floor(Math.random() * can.length), 1)[0]);
  if (!pick.length) { S.pendingLevels = 0; S.p.hp = Math.min(S.p.maxHp, S.p.hp + 20); return; }
  S.paused = true; stick.id = null;
  const box = $('choices'); box.innerHTML = '';
  pick.forEach((k, i) => {
    const sk = SKILLS[k], next = lvOf(k) + 1;
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = `<span class="icon" style="background:${sk.color}">${sk.icon}</span>
      <span><span class="name">${i + 1}. ${sk.name}</span><span class="lv">${next === 1 ? 'NEW' : 'Lv' + next}</span>
      <span class="desc">${sk.desc(next)}</span></span>`;
    b.addEventListener('click', () => {
      S.skills[k] = next; S.pendingLevels--;
      $('levelup').classList.remove('show'); S.paused = false; last = performance.now();
    }, { once: true });
    box.appendChild(b);
  });
  $('levelup').classList.add('show');
}

// ---------- 終了 ----------
const clock = t => {
  const m = START_MIN + Math.min(GAME_SEC, Math.floor(t));
  return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
};
function endGame(win) {
  S.running = false; S.over = true; stick.id = null;
  $('levelup').classList.remove('show');
  $('rTime').textContent = win ? '17:00' : clock(S.t);
  $('rTitle').textContent = win ? '定時退社' : '残業確定';
  let verdict;
  if (!win) verdict = S.t < 20 ? '開始早々、通知の波に飲まれた。' : S.t < 40 ? '会議が会議を呼んで、気づけば夕方。' : '「ちょっといい？」はちょっとではなかった。';
  else verdict = S.bossDefeated ? '「ちょっといい？」すら退けた。伝説の定時退社。' : 'PCを閉じる音が、静かなフロアに響いた。';
  $('rVerdict').textContent = verdict;
  const learned = Object.keys(S.skills).map(k => `${SKILLS[k].name} Lv${S.skills[k]}`).join(' / ');
  $('rStats').innerHTML = [
    [S.kills, 'さばいた案件'], ['Lv ' + S.lv, '到達レベル'],
    [Math.round(S.damage), '総返信量'], [S.bossDefeated ? '撃退' : S.bossSpawned ? '未撃退' : '未遭遇', '「ちょっといい？」'],
  ].map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('')
    + `<div class="stat" style="grid-column:1/-1;font-size:13px">${learned}</div>`;
  $('result').classList.add('show');
}

// ---------- 描画 ----------
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#151b26'; ctx.fillRect(0, 0, W, H);
  if (!S) return;
  const p = S.p;
  const sx = (Math.random() - .5) * S.shake, sy = (Math.random() - .5) * S.shake;
  ctx.save();
  ctx.translate(W / 2 + sx, H / 2 + sy);
  ctx.scale(ZOOM, ZOOM);
  ctx.translate(-p.x, -p.y);

  // 床（オフィスのタイルカーペット）
  const T = 64, hw = W / 2 / ZOOM + T, hh = H / 2 / ZOOM + T;
  const x0 = Math.floor((p.x - hw) / T) * T, y0 = Math.floor((p.y - hh) / T) * T;
  for (let x = x0; x < p.x + hw; x += T) for (let y = y0; y < p.y + hh; y += T) {
    ctx.fillStyle = ((x / T + y / T) & 1) ? '#1b2331' : '#19202d';
    ctx.fillRect(x, y, T, T);
  }

  // 既読スルー
  if (lvOf('aura')) {
    const R = auraR();
    ctx.fillStyle = 'rgba(143,211,255,.09)';
    ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(143,211,255,.35)'; ctx.setLineDash([6, 8]); ctx.lineDashOffset = -S.t * 20;
    ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]);
  }

  // 工数・おやつ
  for (const g of S.gems) {
    ctx.fillStyle = g.v >= 6 ? '#b58cff' : g.v >= 2 ? '#6aa8ff' : '#7fd1ff';
    ctx.beginPath(); ctx.moveTo(g.x, g.y - 6); ctx.lineTo(g.x + 5, g.y); ctx.lineTo(g.x, g.y + 6); ctx.lineTo(g.x - 5, g.y); ctx.closePath(); ctx.fill();
  }
  ctx.font = `20px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const s of S.snacks) ctx.fillText('🍩', s.x, s.y);

  // 敵
  for (const e of S.enemies) {
    const r = e.def.r;
    ctx.fillStyle = e.flash > 0 ? '#ffffff' : e.def.color;
    roundRect(e.x - r * 1.35, e.y - r * 0.85, r * 2.7, r * 1.7, 5); ctx.fill();
    ctx.fillStyle = '#10151f';
    const fs = e.type === 'boss' ? 13 : Math.max(9, r * 0.62);
    ctx.font = `700 ${fs}px ${FONT}`;
    ctx.fillText(e.def.label, e.x, e.y + 0.5, r * 2.5);
    if (e.type === 'boss') {
      const w = 90;
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(e.x - w / 2, e.y - r - 14, w, 6);
      ctx.fillStyle = '#ef5b6b'; ctx.fillRect(e.x - w / 2, e.y - r - 14, w * Math.max(0, e.hp / e.maxHp), 6);
    }
  }

  // 議事録
  const ol = lvOf('orbit');
  if (ol) {
    const spd = ol >= 5 ? 4.2 : 3;
    for (let i = 0; i < ol; i++) {
      const a = S.t * spd + i / ol * Math.PI * 2;
      const ox = p.x + Math.cos(a) * 78, oy = p.y + Math.sin(a) * 78;
      ctx.save(); ctx.translate(ox, oy); ctx.rotate(a);
      ctx.fillStyle = '#f2f2f2'; ctx.fillRect(-9, -12, 18, 24);
      ctx.fillStyle = '#9aa6bb'; for (let l = 0; l < 4; l++) ctx.fillRect(-6, -7 + l * 5, 12, 1.5);
      ctx.restore();
    }
  }

  // 弾
  for (const s of S.shots) {
    ctx.font = `700 ${s.label === 'Re:' ? 12 : 11}px ${FONT}`;
    const w = ctx.measureText(s.label).width + 10;
    ctx.fillStyle = s.color; roundRect(s.x - w / 2, s.y - 9, w, 18, 9); ctx.fill();
    ctx.fillStyle = '#10151f'; ctx.fillText(s.label, s.x, s.y + 0.5);
  }

  // 自分
  ctx.fillStyle = p.hurt > 0 ? '#ef5b6b' : '#eef2f8';
  ctx.beginPath(); ctx.arc(p.x, p.y, 13, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#10151f'; ctx.font = `800 12px ${FONT}`; ctx.fillText('私', p.x, p.y + 0.5);
  // 社員証
  ctx.strokeStyle = '#6aa8ff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(p.x - 6, p.y + 10); ctx.lineTo(p.x, p.y + 17); ctx.lineTo(p.x + 6, p.y + 10); ctx.stroke();

  // 文字
  for (const t of S.texts) {
    ctx.globalAlpha = Math.min(1, t.life * 2.5);
    ctx.font = `800 ${t.size}px ${FONT}`;
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(t.str, t.x, t.y);
    ctx.fillStyle = t.color; ctx.fillText(t.str, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawHud();
  if (stick.id !== null && S.running && !S.paused) drawStick();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawHud() {
  const top = 10 + safeTop(), pad = 12;
  // 時計
  const left = GAME_SEC - S.t;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.font = `800 30px ${FONT}`;
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.55)';
  const c = clock(S.t);
  ctx.strokeText(c, W / 2, top); ctx.fillStyle = left < 10 ? '#5ad3a0' : '#eef2f8'; ctx.fillText(c, W / 2, top);
  ctx.font = `600 12px ${FONT}`; ctx.fillStyle = '#9aa6bb';
  ctx.fillText(`定時まであと ${Math.max(0, Math.ceil(left))} 分`, W / 2, top + 36);

  // HP
  const bw = Math.min(160, W * 0.36);
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(pad, top + 4, bw, 10);
  ctx.fillStyle = '#ef5b6b'; ctx.fillRect(pad, top + 4, bw * S.p.hp / S.p.maxHp, 10);
  ctx.fillStyle = '#eef2f8'; ctx.font = `700 11px ${FONT}`; ctx.fillText(`HP ${Math.ceil(S.p.hp)}`, pad, top + 18);
  // 撃破数・Lv
  ctx.textAlign = 'right';
  ctx.font = `700 13px ${FONT}`; ctx.fillText(`Lv ${S.lv}`, W - pad, top + 2);
  ctx.fillStyle = '#9aa6bb'; ctx.font = `600 11px ${FONT}`; ctx.fillText(`${S.kills} 件処理`, W - pad, top + 20);

  // 工数ゲージ（下端）
  const by = H - 8 - safeBottom();
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, by, W, 8);
  ctx.fillStyle = '#6aa8ff'; ctx.fillRect(0, by, W * S.xp / S.xpNext, 8);
}
function drawStick() {
  ctx.globalAlpha = 0.35;
  ctx.strokeStyle = '#eef2f8'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(stick.ox, stick.oy, STICK_R, 0, Math.PI * 2); ctx.stroke();
  const dx = stick.x - stick.ox, dy = stick.y - stick.oy, d = Math.hypot(dx, dy), m = Math.min(d, STICK_R) / (d || 1);
  ctx.fillStyle = '#eef2f8';
  ctx.beginPath(); ctx.arc(stick.ox + dx * m, stick.oy + dy * m, 22, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
}
// iPhone のノッチ・ホームバーを避ける
const probe = document.createElement('div');
probe.style.cssText = 'position:fixed;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);visibility:hidden;pointer-events:none';
document.body.appendChild(probe);
const safeTop = () => probe.getBoundingClientRect().top;
const safeBottom = () => innerHeight - probe.getBoundingClientRect().bottom;

// ---------- ループ ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (S && S.running && !S.paused && !document.hidden) update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.addEventListener('visibilitychange', () => { last = performance.now(); });

function start() {
  newGame();
  $('title').classList.remove('show'); $('result').classList.remove('show');
  last = performance.now();
}
$('start').addEventListener('click', start);
$('retry').addEventListener('click', start);
</script>
</body>
